<svg width="660" height="420" viewBox="0 0 660 420" xmlns="http://www.w3.org/2000/svg">
  <!-- DMG window background. Render with scripts/dmg-background.sh. Icon slots: app (170,236), Applications (490,236). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#efece5"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.12" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#f4dccf" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f4dccf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.92" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#dce6f2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#dce6f2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="0.8" fill="#1d1d1f" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.2"/>
    </linearGradient>
    <mask id="dotmask"><rect width="660" height="420" fill="url(#fade)"/></mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Swapbar mark, as drawn by the menu bar template icon: knobs solid, pills at 45%. -->
    <symbol id="mark" viewBox="-0.5 0 41 41">
      <path d="M1.07313 21.0013C-1.13601 17.175 0.174995 12.2823 4.00134 10.0731L19.5898 1.07313C23.4161 -1.13601 28.3089 0.174995 30.518 4.00134C32.7271 7.82768 31.4161 12.7204 27.5898 14.9295L12.0013 23.9295C8.17499 26.1387 3.28227 24.8277 1.07313 21.0013Z" fill-opacity="0.45"/>
      <path d="M16.6616 12.0013C14.4524 8.175 15.7635 3.28227 19.5898 1.07313C23.4161 -1.13601 28.3089 0.174995 30.518 4.00134C32.7271 7.82768 31.4161 12.7204 27.5898 14.9295C23.7635 17.1387 18.8707 15.8277 16.6616 12.0013Z"/>
      <path d="M8.70692 36.224C6.49778 32.3977 7.80878 27.5049 11.6351 25.2958L27.2236 16.2958C31.0499 14.0866 35.9426 15.3976 38.1518 19.224C40.3609 23.0503 39.0499 27.9431 35.2236 30.1522L19.6351 39.1522C15.8088 41.3613 10.9161 40.0503 8.70692 36.224Z" fill-opacity="0.45"/>
      <path d="M8.70692 36.224C6.49778 32.3977 7.80878 27.5049 11.6351 25.2958C15.4615 23.0866 20.3542 24.3976 22.5633 28.224C24.7725 32.0503 23.4615 36.9431 19.6351 39.1522C15.8088 41.3613 10.9161 40.0503 8.70692 36.224Z"/>
    </symbol>
  </defs>

  <!-- canvas -->
  <rect width="660" height="420" fill="url(#bg)"/>
  <rect width="660" height="420" fill="url(#warm)"/>
  <rect width="660" height="420" fill="url(#cool)"/>
  <rect width="660" height="420" fill="url(#dots)" mask="url(#dotmask)"/>

  <!-- miniature menu bar: where the app lives after install (mirrors site/src/components/Mock.tsx) -->
  <rect x="0" y="0" width="660" height="30" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="0" y="30" width="660" height="1" fill="#1d1d1f" fill-opacity="0.06"/>
  <g font-family="SF Pro Text, -apple-system, Helvetica Neue, sans-serif" font-size="12.5" fill="#1d1d1f" fill-opacity="0.72">
    <text x="20" y="19.5" font-weight="600" fill-opacity="0.85">Finder</text>
    <text x="78" y="19.5">File</text>
    <text x="118" y="19.5">Edit</text>
    <text x="160" y="19.5">View</text>
    <text x="206" y="19.5">Go</text>
    <text x="241" y="19.5">Window</text>
    <text x="305" y="19.5">Help</text>
    <text x="600" y="19.5" text-anchor="end">Sat 18 Oct</text>
    <text x="640" y="19.5" text-anchor="end" font-variant-numeric="tabular-nums">03:14</text>
  </g>
  <g fill="none" stroke="#1d1d1f" stroke-opacity="0.72" stroke-linecap="round">
    <!-- wifi -->
    <path transform="translate(440 9)" d="M1.5 4.2a9.5 9.5 0 0 1 13 0M3.9 6.6a6.2 6.2 0 0 1 8.2 0M6.3 9a2.9 2.9 0 0 1 3.4 0" stroke-width="1.4"/>
    <!-- battery -->
    <g transform="translate(470 10)" stroke-width="1.2">
      <rect x="0.6" y="0.6" width="17.8" height="9.8" rx="2.4"/>
      <path d="M20.2 3.8v3.4"/>
      <rect x="2.1" y="2.1" width="12.5" height="6.8" rx="1.2" fill="#1d1d1f" fill-opacity="0.72" stroke="none"/>
    </g>
    <!-- control center -->
    <g transform="translate(507 9)" stroke-width="1.3">
      <rect x="0.7" y="0.7" width="12.6" height="4" rx="2"/>
      <circle cx="3" cy="2.7" r="1.1" fill="#1d1d1f" fill-opacity="0.72" stroke="none"/>
      <rect x="0.7" y="7.3" width="12.6" height="4" rx="2"/>
      <circle cx="11" cy="9.3" r="1.1" fill="#1d1d1f" fill-opacity="0.72" stroke="none"/>
    </g>
  </g>
  <!-- the Swapbar item, highlighted -->
  <rect x="368" y="4" width="60" height="22" rx="6" fill="#1d1d1f" fill-opacity="0.08"/>
  <use href="#mark" x="375" y="7" width="16" height="16" fill="#1d1d1f"/>
  <text x="395" y="19.5" font-family="SF Pro Text, -apple-system, Helvetica Neue, sans-serif" font-size="12.5" font-weight="500" fill="#1d1d1f" fill-opacity="0.85">72%</text>

  <!-- handwritten note pointing up to the menu bar item -->
  <path d="M332 78 C 362 74, 390 60, 398 36" fill="none" stroke="#d97757" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M391.3 42.6 L 398 36 L 400.5 45" fill="none" stroke="#d97757" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="324" y="83" text-anchor="end" font-family="New York, Georgia, serif" font-style="italic" font-size="15" fill="#b85c3d">no Dock icon. it lives up here</text>

  <!-- swap arrow between the icons -->
  <g fill="none" stroke="#d97757" stroke-linecap="round" stroke-linejoin="round">
    <path d="M252 222 C 296 184, 364 184, 408 222" stroke-width="2.4" stroke-dasharray="1 8"/>
    <path d="M404.1 210.7 L 408 222 L 396.2 219.8" stroke-width="2.4"/>
  </g>
  <text x="330" y="176" text-anchor="middle" font-family="New York, Georgia, serif" font-style="italic" font-size="16" fill="#b85c3d">drag to install</text>

  <!-- footer -->
  <g font-family="SF Pro Text, -apple-system, Helvetica Neue, sans-serif" text-anchor="middle">
    <text x="330" y="378" font-size="12" font-weight="500" fill="#6e6e73">Every Claude account, one click away.</text>
    <text x="330" y="397" font-size="11" fill="#a1a1a6">Needs cswap · macOS 14 or later</text>
  </g>
</svg>
