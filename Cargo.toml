[package]
name = "swapbar"
version = "0.1.0"
edition = "2024"

[dependencies]
block = "0.1"
chrono = "0.4.45"
cocoa = "0.26"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
objc = "0.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"

[lints.rust]
unexpected_cfgs = { level = "allow" }

# Measured on arm64: 6.6 MB → 3.0 MB with no measurable slowdown in the transcript scan.
# opt-level "z" saves another 0.6 MB but makes the scan ~2× slower.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
