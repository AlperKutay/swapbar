name: Download badge

# Keeps badges/downloads.json (on the `badges` branch) in sync with the total
# .dmg downloads, for the README's shields.io endpoint badge. Shields then reads a
# plain file instead of calling the GitHub API, which intermittently returned
# "invalid".

on:
  schedule:
    - cron: '17 * * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Count downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/download-badge.sh > "$RUNNER_TEMP/downloads.json" && cat "$RUNNER_TEMP/downloads.json"

      - name: Publish to the badges branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch --depth 1 origin +badges:refs/remotes/origin/badges
            git switch -c badges origin/badges
          else
            git switch --orphan badges
          fi
          cp "$RUNNER_TEMP/downloads.json" downloads.json
          git add downloads.json
          if git diff --cached --quiet; then
            echo "Unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update download count: $(jq -r .message downloads.json)"
          git push -q origin badges
